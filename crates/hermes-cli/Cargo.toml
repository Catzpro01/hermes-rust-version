[package]
name = "hermes-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
rustyline = "14"
tracing-subscriber.workspace = true
futures.workspace = true
url.workspace = true
hermes-core = { path = "../hermes-core" }
tokio.workspace = true
tokio-util.workspace = true
# Spec 012 — TUI dashboard (display-only; no core dependency).
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
inquire = "0.7"
# Spec 017 T05 — the setup wizard edits config.yaml as a YAML mapping.
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile.workspace = true


[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs", "poll", "process", "signal", "term"] }

wiremock = "0.6"
rusqlite.workspace = true
