name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  workflow-regression:
    name: CI gate regression tests
    runs-on: [self-hosted, vps, hermes]
    # The 8-worker elastic pool shares cores with the n8n repo's micro-jobs
    # (see .scratch/INFRASTRUCTURE-HANDOFF.md); a 5m ceiling got killed under
    # contention (run 34902358798) even though these tests need ~1 minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install QA dependency
        run: |
          python3 -m pip --version || { echo 'python3 -m pip is required on this runner'; exit 1; }
          python3 -m pip install PyYAML==6.0.3 pyte==0.8.2 wcwidth==0.8.3 \
            || python3 -m pip install --break-system-packages PyYAML==6.0.3 pyte==0.8.2 wcwidth==0.8.3
      - name: Test workflow gates
        run: |
          python3 scripts/test_ci_workflow.py
          python3 scripts/test_capture_ui.py
          python3 scripts/test_picker_footer_position_checks.py
          python3 scripts/test_picker_footer_color_checks.py
          python3 scripts/test_picker_normal_header_checks.py
          python3 scripts/test_picker_filter_header_checks.py
          python3 scripts/test_picker_column_layout_checks.py
          python3 scripts/test_picker_message_style_checks.py
          python3 scripts/test_picker_selection_checks.py
          python3 scripts/test_picker_status_ink_checks.py
          python3 scripts/test_picker_redraw_on_input_checks.py
          python3 scripts/test_picker_terminal_size_checks.py
          python3 scripts/test_picker_browse_control_checks.py
          python3 scripts/test_wizard_fields_checks.py
      - run: python3 scripts/test_audit_ui_evidence.py
      - name: Verify agent handoff and safe checkpoint automation
        run: |
          python3 agent-support/automation/verify.py
          python3 agent-support/automation/test_checkpoint.py

  test:
    name: fmt + clippy + test
    runs-on: [self-hosted, vps, hermes]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Self-hosted system python may lack pip (run 34891514988 died at the
      # picker step's pip guard); provision a known-good interpreter.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install official Rust toolchain
        run: |
          msrv_ok() { rustc --version 2>/dev/null | awk '{ split($2, v, "."); exit !(v[1] > 1 || (v[1] == 1 && v[2] >= 88)) }'; }
          if command -v rustup >/dev/null 2>&1; then
            # `rustup update` installs stable when missing AND upgrades a stale
            # one: self-hosted runners can lag behind the locked Cargo.lock's
            # MSRV (run 34889606785 failed with rustc 1.85.1 < 1.88).
            rustup update stable --profile minimal --component rustfmt --component clippy \
              || rustup toolchain install stable --profile minimal --component rustfmt --component clippy \
              || echo "::warning::rustup could not update the stable toolchain; continuing with whatever is installed"
            rustup default stable
            # Pool variance guard (run 34912294831): some elastic workers keep
            # a stale rustup default (rustc 1.85.1) while newer toolchains are
            # installed alongside. Cargo.lock needs >= 1.88 — when the default
            # cannot satisfy that, activate the newest installed toolchain that
            # can; fail loudly if none exists instead of letting the picker
            # step die mysteriously later.
            if ! msrv_ok; then
              NEWEST="$(rustup toolchain list 2>/dev/null | sed 's/ (default)$//' | grep -E '^[0-9]+\.[0-9]+' | sort -V | tail -1 || true)"
              if [ -n "$NEWEST" ] && rustup run "$NEWEST" rustc --version 2>/dev/null \
                   | awk '{ split($2, v, "."); exit !(v[1] > 1 || (v[1] == 1 && v[2] >= 88)) }'; then
                rustup default "$NEWEST"
              else
                rustc --version || true
                rustup toolchain list || true
                echo "this runner has no rustc >= 1.88 (Cargo.lock MSRV); install a newer stable toolchain"
                exit 1
              fi
            fi
          fi
          for tool in rustc cargo rustfmt cargo-clippy; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "this runner is missing $tool; install the stable Rust toolchain with rustfmt and clippy"
              exit 1
            }
          done
          rustc --version
          cargo --version
          # Pin the ACTIVE toolchain's bin dir to the front of PATH for every
          # later step (run 34912294831: the picker step resolved a stale
          # rustc 1.85.1 while fmt/clippy/test used a newer one).
          TOOLCHAIN_BIN="$(dirname "$(rustup which cargo 2>/dev/null || command -v cargo)")"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      # Self-hosted runners may provide sccache (e.g. via the runner .env).
      # Enable it only when present so hosted runners keep working unchanged.
      # Never set CARGO_INCREMENTAL here: incremental compilation defeats
      # sccache caching.
      - name: Enable sccache if available
        id: sccache_probe
        run: |
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
            sccache --zero-stats || true
            echo "sccache=present" >> "$GITHUB_OUTPUT"
            echo "::notice title=sccache enabled::RUSTC_WRAPPER=sccache for the cargo steps"
          else
            echo "sccache not found on this runner; building without a wrapper"
            echo "sccache=absent" >> "$GITHUB_OUTPUT"
            echo "::notice title=sccache::not present on this runner; building without a wrapper"
          fi

      - name: cargo fmt --check
        id: fmt
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log
        continue-on-error: true

      - name: cargo clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
        continue-on-error: true

      - name: cargo test
        id: test
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
        continue-on-error: true

      - name: Picker terminal regressions
        id: picker
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: |
          QA="${RUNNER_TEMP:-/tmp}/picker-qa"
          set -o pipefail
          # Self-hosted quirk (run 34893179340): cargo can drop off PATH in
          # this step even though earlier cargo steps in the same job worked.
          # Repair PATH by asking rustup for the ACTIVE toolchain's cargo
          # (`rustup which cargo`) so this step always builds with the same
          # toolchain that passed fmt/clippy/test — on fresh pool workers,
          # blindly prepending ~/.cargo/bin can surface a stale user-level
          # toolchain (run 34902358798 picked up rustc 1.85.1 that way).
          # Fail loudly with PATH diagnostics in the exported log if cargo is
          # still missing.
          if ! command -v cargo >/dev/null 2>&1; then
            if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
            if command -v rustup >/dev/null 2>&1; then
              RUSTUP_CARGO="$(rustup which cargo 2>/dev/null || true)"
              if [ -n "$RUSTUP_CARGO" ]; then
                export PATH="$(dirname "$RUSTUP_CARGO"):$PATH"
              fi
            fi
            command -v cargo >/dev/null 2>&1 || export PATH="$HOME/.cargo/bin:$PATH"
          fi
          command -v cargo >/dev/null 2>&1 || { echo "cargo missing in picker step; PATH=$PATH" | tee picker-position.log; exit 1; }
          { command -v rustc >/dev/null 2>&1 && rustc --version; cargo --version; } 2>&1 | tee picker-position.log
          cargo build --locked -p hermes-rs --bin hermes-rs 2>&1 | tee -a picker-position.log
          rm -rf "$QA"
          python3 -m pip --version >/dev/null 2>&1 || python3 -m ensurepip --upgrade >/dev/null 2>&1 \
            || { echo 'python3 -m pip is required on this runner'; exit 1; }
          python3 -m pip install --target "$QA" pyte==0.8.2 wcwidth==0.8.3 2>&1 | tee -a picker-position.log \
            || python3 -m pip install --target "$QA" --break-system-packages pyte==0.8.2 wcwidth==0.8.3 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-position.json python3 scripts/test_picker_footer_position.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-color.json python3 scripts/test_picker_footer_color.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-header.json python3 scripts/test_picker_normal_header.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-filter-header.json python3 scripts/test_picker_filter_header.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-column-layout.json python3 scripts/test_picker_column_layout.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-message-style.json python3 scripts/test_picker_message_style.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-selection.json python3 scripts/test_picker_selection.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-status-ink.json python3 scripts/test_picker_status_ink.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-redraw-on-input.json python3 scripts/test_picker_redraw_on_input.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-terminal-size.json python3 scripts/test_picker_terminal_size.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-browse-control.json python3 scripts/test_picker_browse_control.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=wizard-fields.json python3 scripts/test_wizard_fields.py 2>&1 | tee -a picker-position.log

      # Small self-hosted runners (2 core / 2 GB) need OOM visibility. Capture
      # memory and any kernel OOM kills; dmesg may be unreadable without root,
      # which is fine and must not fail the job. Never set CARGO_INCREMENTAL.
      - name: Record memory and OOM diagnostics
        if: always()
        run: |
          set +e
          {
            echo "== host =="
            uname -a
            echo "== free -m =="
            free -m 2>/dev/null || cat /proc/meminfo 2>/dev/null | head -5
            echo "== swap =="
            swapon --show 2>/dev/null || grep -i swap /proc/meminfo 2>/dev/null
            echo "== dmesg OOM kills =="
            dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20 || echo "(dmesg unavailable or no OOM lines)"
            echo "== sccache =="
            if command -v sccache >/dev/null 2>&1; then sccache --show-stats 2>/dev/null || true; else echo "(no sccache on PATH)"; fi
            echo "== linker =="
            if command -v mold >/dev/null 2>&1; then mold --version 2>/dev/null || true; else echo "(mold not on PATH)"; fi
            ld --version 2>/dev/null | head -1 || true
          } > memory-oom.log 2>&1
          set -e
          cat memory-oom.log
          if grep -qiE 'out of memory|oom-kill' memory-oom.log; then
            echo "::error title=OOM kill detected::kernel OOM events found during this job; see the memory/OOM diagnostics step"
          fi
          mem_summary=$(free -m 2>/dev/null | awk '/^Mem:/ {printf "mem %sMiB used of %sMiB", $3, $2} /^Swap:/ {printf "; swap %sMiB used of %sMiB", $3, $2}')
          echo "::notice title=memory::${mem_summary:-memory summary unavailable on this runner}"

      # Diagnostics are emitted as check-run annotations (readable via the
      # REST API even where raw logs/artifacts are not reachable) and as a
      # job summary.
      - name: Publish diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import re, os
          def blocks(path, pat):
              try: txt = open(path).read()
              except FileNotFoundError: return []
              out, cur = [], None
              for line in txt.splitlines():
                  if re.match(pat, line):
                      if cur: out.append(cur)
                      cur = [line]
                  elif cur is not None:
                      if line.startswith(('   Compiling', '    Checking', '    Finished', 'warning: `', 'error: could not compile')):
                          out.append(cur); cur = None
                      else:
                          cur.append(line)
              if cur: out.append(cur)
              return out
          def emit(kind, title, lines, limit=40):
              body = "\n".join(lines[:limit]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f"::{kind} title={title}::{body}")
          try: fmt = open('fmt.log').read()
          except FileNotFoundError: fmt = ''
          if os.environ.get('FMT') != 'success':
              emit('error', 'rustfmt', fmt.splitlines() or ['Formatting check did not succeed.'])
          if os.environ.get('PICKER') != 'success':
              try: picker_log = open('picker-position.log').read().splitlines()
              except FileNotFoundError: picker_log = ['CLI terminal regression did not succeed.']
              emit('error', 'picker terminal', picker_log[-30:])
          n = 0
          for b in blocks('clippy.log', r'^(error|warning)(\[|:)'):
              if n >= 45: break
              emit('error' if b[0].startswith('error') else 'warning', 'clippy', b); n += 1
          # Passing cancellation/error-path tests can print `error: ...`.
          # Only classify these lines as build diagnostics when tests failed.
          if os.environ.get('TEST') != 'success':
              for b in blocks('test.log', r'^(error)(\[|:)'):
                  if n >= 45: break
                  emit('error', 'test-build', b); n += 1
          try: t = open('test.log').read()
          except FileNotFoundError: t = ''
          for m in re.finditer(r'^---- (.+?) stdout ----\n(.*?)(?=^---- |^failures:|\Z)', t, re.S | re.M):
              if n >= 48: break
              emit('error', f'test failed: {m.group(1)}', m.group(2).splitlines(), 25); n += 1
          results = re.findall(r'^test result: .*$', t, re.M)
          fails = re.findall(r'^    (\S+)$', t.split('failures:')[-1], re.M) if 'failures:' in t else []
          emit('notice', 'summary', [f"fmt={os.environ.get('FMT')} clippy={os.environ.get('CLIPPY')} test={os.environ.get('TEST')} picker={os.environ.get('PICKER')}"] + results + (["FAILED: " + ", ".join(fails)] if fails else []), 60)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("```\n" + "\n".join(results) + "\n" + "\n".join(fails) + "\n```\n")
          PY
        env:
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          PICKER: ${{ steps.picker.outcome }}

      # Offer a verified, reviewable patch when the sandbox has no Rust
      # toolchain. This never commits/pushes and never changes the failed
      # outcome of the original format check.
      - name: Prepare formatting patch
        id: format_recovery
        if: ${{ !cancelled() && steps.fmt.outcome == 'failure' }}
        run: |
          set -o pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --locked 2>&1 | tee format-recovery-check.log
          python3 scripts/export_format_patch.py

      - name: Export formatting patch group 2
        if: ${{ !cancelled() && steps.format_recovery.outcome == 'success' }}
        run: python3 scripts/export_format_patch.py --group 1

      - name: Export formatting patch group 3
        if: ${{ !cancelled() && steps.format_recovery.outcome == 'success' }}
        run: python3 scripts/export_format_patch.py --group 2

      - name: Export formatting patch group 4
        if: ${{ !cancelled() && steps.format_recovery.outcome == 'success' }}
        run: python3 scripts/export_format_patch.py --group 3

      - name: Export formatting patch group 5
        if: ${{ !cancelled() && steps.format_recovery.outcome == 'success' }}
        run: python3 scripts/export_format_patch.py --group 4

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-logs
          retention-days: 90
          path: |
            fmt.log
            clippy.log
            test.log
            format-recovery-check.log
            fmt.patch
            memory-oom.log
            picker-position.log
            picker-position.json
            picker-color.json
            picker-header.json
            picker-filter-header.json
            picker-column-layout.json
            picker-message-style.json
            picker-selection.json
            picker-status-ink.json
            picker-redraw-on-input.json
            picker-terminal-size.json
            picker-browse-control.json
            wizard-fields.json

      - name: Fail if any step failed
        if: always() && (steps.fmt.outcome != 'success' || steps.clippy.outcome != 'success' || steps.test.outcome != 'success' || steps.picker.outcome != 'success')
        run: exit 1
