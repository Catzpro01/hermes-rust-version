name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  workflow-regression:
    name: CI gate regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Per-job QA directory: `runner.temp` is unique per job, so concurrent jobs
      # on the same machine (self-hosted or hosted) never share site-packages.
      QA: ${{ runner.temp }}/picker-qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install QA dependency
        run: |
          python3 -m pip --version || { echo 'python3 -m pip is required on this runner'; exit 1; }
          python3 -m pip install PyYAML==6.0.3 pyte==0.8.2 wcwidth==0.8.3 \
            || python3 -m pip install --break-system-packages PyYAML==6.0.3 pyte==0.8.2 wcwidth==0.8.3
      - name: Test workflow gates
        run: |
          python3 scripts/test_ci_workflow.py
          python3 scripts/test_capture_ui.py
          python3 scripts/test_picker_footer_position_checks.py
          python3 scripts/test_picker_footer_color_checks.py
          python3 scripts/test_picker_normal_header_checks.py
          python3 scripts/test_picker_filter_header_checks.py
          python3 scripts/test_picker_column_layout_checks.py
          python3 scripts/test_picker_message_style_checks.py
          python3 scripts/test_picker_selection_checks.py
          python3 scripts/test_picker_status_ink_checks.py
          python3 scripts/test_picker_redraw_on_input_checks.py
          python3 scripts/test_picker_terminal_size_checks.py
      - run: python3 scripts/test_audit_ui_evidence.py
      - name: Verify agent handoff and safe checkpoint automation
        run: |
          python3 agent-support/automation/verify.py
          python3 agent-support/automation/test_checkpoint.py

  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Per-job QA directory: `runner.temp` is unique per job, so concurrent jobs
      # on the same machine (self-hosted or hosted) never share site-packages.
      QA: ${{ runner.temp }}/picker-qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install official Rust toolchain
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
          fi
          for tool in rustc cargo rustfmt cargo-clippy; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "this runner is missing $tool; install the stable Rust toolchain with rustfmt and clippy"
              exit 1
            }
          done
          rustc --version
          cargo --version

      - name: cargo fmt --check
        id: fmt
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee fmt.log
        continue-on-error: true

      - name: cargo clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
        continue-on-error: true

      - name: cargo test
        id: test
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
        continue-on-error: true

      - name: Picker terminal regressions
        id: picker
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --locked -p hermes-rs --bin hermes-rs 2>&1 | tee picker-position.log
          rm -rf "$QA"
          python3 -m pip --version || { echo 'python3 -m pip is required on this runner'; exit 1; }
          python3 -m pip install --target "$QA" pyte==0.8.2 wcwidth==0.8.3 2>&1 | tee -a picker-position.log \
            || python3 -m pip install --target "$QA" --break-system-packages pyte==0.8.2 wcwidth==0.8.3 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-position.json python3 scripts/test_picker_footer_position.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-color.json python3 scripts/test_picker_footer_color.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-header.json python3 scripts/test_picker_normal_header.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-filter-header.json python3 scripts/test_picker_filter_header.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-column-layout.json python3 scripts/test_picker_column_layout.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-message-style.json python3 scripts/test_picker_message_style.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-selection.json python3 scripts/test_picker_selection.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-status-ink.json python3 scripts/test_picker_status_ink.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-redraw-on-input.json python3 scripts/test_picker_redraw_on_input.py 2>&1 | tee -a picker-position.log
          PYTHONPATH="$QA" HERMES_PICKER_BINARY=target/debug/hermes-rs HERMES_PICKER_RECORDING=picker-terminal-size.json python3 scripts/test_picker_terminal_size.py 2>&1 | tee -a picker-position.log

      # Diagnostics are emitted as check-run annotations (readable via the
      # REST API even where raw logs/artifacts are not reachable) and as a
      # job summary.
      - name: Publish diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import re, os
          def blocks(path, pat):
              try: txt = open(path).read()
              except FileNotFoundError: return []
              out, cur = [], None
              for line in txt.splitlines():
                  if re.match(pat, line):
                      if cur: out.append(cur)
                      cur = [line]
                  elif cur is not None:
                      if line.startswith(('   Compiling', '    Checking', '    Finished', 'warning: `', 'error: could not compile')):
                          out.append(cur); cur = None
                      else:
                          cur.append(line)
              if cur: out.append(cur)
              return out
          def emit(kind, title, lines, limit=40):
              body = "\n".join(lines[:limit]).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f"::{kind} title={title}::{body}")
          try: fmt = open('fmt.log').read()
          except FileNotFoundError: fmt = ''
          if os.environ.get('FMT') != 'success':
              emit('error', 'rustfmt', fmt.splitlines() or ['Formatting check did not succeed.'])
          if os.environ.get('PICKER') != 'success':
              try: picker_log = open('picker-position.log').read().splitlines()
              except FileNotFoundError: picker_log = ['CLI terminal regression did not succeed.']
              emit('error', 'picker terminal', picker_log[-30:])
          n = 0
          for b in blocks('clippy.log', r'^(error|warning)(\[|:)'):
              if n >= 45: break
              emit('error' if b[0].startswith('error') else 'warning', 'clippy', b); n += 1
          # Passing cancellation/error-path tests can print `error: ...`.
          # Only classify these lines as build diagnostics when tests failed.
          if os.environ.get('TEST') != 'success':
              for b in blocks('test.log', r'^(error)(\[|:)'):
                  if n >= 45: break
                  emit('error', 'test-build', b); n += 1
          try: t = open('test.log').read()
          except FileNotFoundError: t = ''
          for m in re.finditer(r'^---- (.+?) stdout ----\n(.*?)(?=^---- |^failures:|\Z)', t, re.S | re.M):
              if n >= 48: break
              emit('error', f'test failed: {m.group(1)}', m.group(2).splitlines(), 25); n += 1
          results = re.findall(r'^test result: .*$', t, re.M)
          fails = re.findall(r'^    (\S+)$', t.split('failures:')[-1], re.M) if 'failures:' in t else []
          emit('notice', 'summary', [f"fmt={os.environ.get('FMT')} clippy={os.environ.get('CLIPPY')} test={os.environ.get('TEST')} picker={os.environ.get('PICKER')}"] + results + (["FAILED: " + ", ".join(fails)] if fails else []), 60)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("```\n" + "\n".join(results) + "\n" + "\n".join(fails) + "\n```\n")
          PY
        env:
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          PICKER: ${{ steps.picker.outcome }}

      # Offer a verified, reviewable patch when the sandbox has no Rust
      # toolchain. This never commits/pushes and never changes the failed
      # outcome of the original format check.
      - name: Prepare formatting patch
        id: format_recovery
        if: ${{ !cancelled() && steps.fmt.outcome == 'failure' }}
        run: |
          set -o pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --locked 2>&1 | tee format-recovery-check.log
          python3 scripts/export_format_patch.py

      - name: Export formatting patch group 2
        if: ${{ !cancelled() && steps.format_recovery.outcome == 'success' }}
        run: python3 scripts/export_format_patch.py --group 1

      - name: Export formatting patch group 3
        if: ${{ !cancelled() && steps.format_recovery.outcome == 'success' }}
        run: python3 scripts/export_format_patch.py --group 2

      - name: Export formatting patch group 4
        if: ${{ !cancelled() && steps.format_recovery.outcome == 'success' }}
        run: python3 scripts/export_format_patch.py --group 3

      - name: Export formatting patch group 5
        if: ${{ !cancelled() && steps.format_recovery.outcome == 'success' }}
        run: python3 scripts/export_format_patch.py --group 4

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-logs
          retention-days: 90
          path: |
            fmt.log
            clippy.log
            test.log
            format-recovery-check.log
            fmt.patch
            picker-position.log
            picker-position.json
            picker-color.json
            picker-header.json
            picker-filter-header.json
            picker-column-layout.json
            picker-message-style.json
            picker-selection.json
            picker-status-ink.json
            picker-redraw-on-input.json
            picker-terminal-size.json

      - name: Fail if any step failed
        if: always() && (steps.fmt.outcome != 'success' || steps.clippy.outcome != 'success' || steps.test.outcome != 'success' || steps.picker.outcome != 'success')
        run: exit 1
