name: Visual evidence (banner slice)

on:
  push:
    branches: ["arena/01a09c1e-hermes-rust-version"]
    paths:
      - '.scratch/hermes-rs-total-parity/runner-candidate/**'
  workflow_dispatch:
    inputs:
      candidate_patch_base64:
        description: 'Optional pre-commit welcome.rs patch, tested before local application'
        required: false
        type: string
      regression_phase:
        description: 'Expected regression result; red requires the named test to fail'
        type: choice
        options: [none, red, green]
        default: none


permissions:
  contents: read

jobs:
  capture:
    if: github.ref == 'refs/heads/arena/01a09c1e-hermes-rust-version'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Select validation phase
        id: plan
        env:
          INPUT_PHASE: ${{ inputs.regression_phase }}
          INPUT_CANDIDATE: ${{ inputs.candidate_patch_base64 }}
        run: |
          python3 - <<'PYCODE'
          import os, json, pathlib
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              request = json.loads(pathlib.Path('.scratch/hermes-rs-total-parity/runner-candidate/request.json').read_text())
              phase = request['phase']
              candidate = phase != 'none'
          else:
              phase = os.environ['INPUT_PHASE'] or 'none'
              candidate = bool(os.environ['INPUT_CANDIDATE'])
          if phase not in ('none', 'red', 'green'):
              raise SystemExit('Invalid validation phase')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'phase={phase}\ncandidate={str(candidate).lower()}\n')
          PYCODE
      - name: Apply bounded pre-commit candidate
        if: steps.plan.outputs.candidate == 'true'
        env:
          CANDIDATE: ${{ inputs.candidate_patch_base64 }}
        run: |
          python3 - <<'PYCODE'
          import os, base64, pathlib, subprocess, json, hashlib
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              folder = pathlib.Path('.scratch/hermes-rs-total-parity/runner-candidate')
              request = json.loads((folder / 'request.json').read_text())
              patch = (folder / 'candidate.patch').read_bytes()
              source = pathlib.Path('crates/hermes-cli/src/tui/welcome.rs').read_bytes()
              if hashlib.sha256(source).hexdigest() != request['source_sha256'] or hashlib.sha256(patch).hexdigest() != request['patch_sha256']:
                  raise SystemExit('Candidate/source digest mismatch')
          else:
              patch = base64.b64decode(os.environ['CANDIDATE'], validate=True)
          if len(patch) > 40000:
              raise SystemExit('Candidate too large')
          p = pathlib.Path('/tmp/visual-candidate.patch')
          p.write_bytes(patch)
          names = subprocess.check_output(['git', 'apply', '--numstat', str(p)], text=True)
          if not names.strip() or any(line.split('\t')[-1] != 'crates/hermes-cli/src/tui/welcome.rs' for line in names.splitlines()):
              raise SystemExit('Candidate touches a non-allowlisted path')
          subprocess.run(['git', 'apply', '--check', str(p)], check=True)
          subprocess.run(['git', 'apply', str(p)], check=True)
          PYCODE
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --locked
      - name: Exercise ANSI geometry regression
        if: steps.plan.outputs.phase != 'none'
        env:
          PHASE: ${{ steps.plan.outputs.phase }}
        run: |
          set +e
          cargo test --locked -p hermes-rs banner_ansi_preserves_python_reference_layout > regression.log 2>&1
          status=$?
          set -e
          cat regression.log
          if [ "$PHASE" = red ]; then
            test "$status" -ne 0
            grep -F 'test tui::welcome::tests::banner_ansi_preserves_python_reference_layout ... FAILED' regression.log
            echo '::notice title=ANSI regression::RED: named geometry assertion failed as expected; not a parity pass.'
          else
            test "$status" -eq 0
            grep -F 'test tui::welcome::tests::banner_ansi_preserves_python_reference_layout ... ok' regression.log
            echo '::notice title=ANSI regression::GREEN: named geometry regression passed.'
          fi
      - name: Check complete corrected workspace
        if: steps.plan.outputs.phase == 'green'
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast
      - name: Export exactly tested Rust delta
        if: steps.plan.outputs.candidate == 'true'
        run: |
          mkdir -p evidence
          git diff --binary -- '*.rs' > evidence/tested.patch
          python3 scripts/capture_banner.py export evidence/tested.patch --label 'candidate patch'
      - name: Export tested Rust delta group 2
        if: steps.plan.outputs.candidate == 'true'
        run: python3 scripts/capture_banner.py export evidence/tested.patch --label 'candidate patch' --group 1
      - name: Build real CLI
        if: steps.plan.outputs.phase != 'red'
        run: cargo build --locked -p hermes-rs
      - name: Capture offline startup at four terminal sizes
        if: steps.plan.outputs.phase != 'red'
        run: python3 scripts/capture_banner.py rust target/debug/hermes-rs evidence/banner-rust.json
      - name: Export verifiable raw capture group 1
        if: steps.plan.outputs.phase != 'red'
        run: python3 scripts/capture_banner.py export evidence/banner-rust.json
      - name: Export verifiable raw capture group 2
        if: steps.plan.outputs.phase != 'red'
        run: python3 scripts/capture_banner.py export evidence/banner-rust.json --group 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: banner-raw-${{ github.sha }}
          retention-days: 90
          path: evidence/
          if-no-files-found: error
      - name: State evidence boundary
        run: |
          echo 'Diagnostic/capture slice only; no parity pass, full Python CLI proof, or closure sign-off.' >> "$GITHUB_STEP_SUMMARY"
